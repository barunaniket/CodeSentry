version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: codesentry_db
    restart: always
    environment:
      POSTGRES_USER: codesentry
      POSTGRES_PASSWORD: codesentry_password
      POSTGRES_DB: codesentry_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesentry -d codesentry_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
